name: CI

on:
  push:
    branches: master
  pull_request:

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cache/CPM

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format 21
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash /tmp/llvm.sh 21
          sudo apt-get install -y -q clang-format-21
      - name: Check formatting
        run: |
          find . \( -name '*.hpp' -o -name '*.cpp' \) ! -path './.cache/*' ! -path './build*/*' ! -path './folly/*' \
            | xargs clang-format-21 --dry-run --Werror

  build:
    name: build (${{ matrix.compiler }}, ${{ matrix.build_type }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]
        include:
          - compiler: gcc
            cc: gcc-14
            cxx: g++-14
          - compiler: clang
            cc: clang-21
            cxx: clang++-21
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ hashFiles('CMakeLists.txt') }}
      - name: Install GCC 14
        if: matrix.compiler == 'gcc'
        run: sudo apt-get install -y -q gcc-14 g++-14
      - name: Install Clang 21
        if: matrix.compiler == 'clang'
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash /tmp/llvm.sh 21
          sudo apt-get install -y -q clang-21
      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake --preset ci -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - run: cmake --build --preset ci
      - run: ctest --preset ci

  gcc16-contracts:
    name: gcc16 (contracts, Debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ hashFiles('CMakeLists.txt') }}
      - name: Install GCC 16
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-16 g++-16
      - name: Configure
        env:
          CC: gcc-16
          CXX: g++-16
        run: cmake --preset ci -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_STANDARD=26 -DCMAKE_CXX_FLAGS=-fcontracts
      - run: cmake --build --preset ci
      - run: ctest --preset ci

  windows:
    name: windows (msvc)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - uses: actions/cache@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-windows-${{ hashFiles('CMakeLists.txt') }}
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        run: cmake --preset dev
      - run: cmake --build --preset dev
      - run: ctest --preset dev

  sanitize:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: asan+ubsan
            preset: asan
          - name: tsan
            preset: tsan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ hashFiles('CMakeLists.txt') }}
      - name: Install Clang 21
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash /tmp/llvm.sh 21
          sudo apt-get install -y -q clang-21
      - name: Configure
        env:
          CC: clang-21
          CXX: clang++-21
        run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --preset ${{ matrix.preset }}

  tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ hashFiles('CMakeLists.txt') }}
      - name: Install Clang 21
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash /tmp/llvm.sh 21
          sudo apt-get install -y -q clang-21 clang-tidy-21
      - name: Configure
        env:
          CC: clang-21
          CXX: clang++-21
        run: cmake --preset ci -DENABLE_CLANG_TIDY=ON -DCLANG_TIDY_EXE=clang-tidy-21
      - name: Build (runs clang-tidy)
        run: cmake --build --preset ci

  # GATING.  Deterministic check of the reclaim-side memory-ordering argument
  # against the C11 abstract machine.  Platform independent -- an x86 runner is
  # fine, since herd7 enumerates the model rather than executing on hardware.
  # If the seq_cst fence in synchronize() is removed or weakened,
  # hazptr-fence.litmus flips away from Never and this job fails.
  herd7:
    name: herd7 (memory model)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.opam
          key: opam-herdtools7-7.58
      - name: Install herdtools7
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q opam
          opam init --bare --no-setup --disable-sandboxing
          opam switch create herd ocaml-system || opam switch herd
          eval $(opam env)
          opam install -y herdtools7.7.58
      - name: Litmus suite
        run: |
          eval $(opam env)
          bash tools/litmus/run.sh

  # NON-GATING.  Hardware stress of the same litmus files.  Informational only:
  # x86 runners are TSO and hide the bug entirely; ARM64 is weak but in practice
  # often stronger than the model; POWER -- where the reviewer actually observed
  # the reordering -- is not available on GitHub.  A clean run here is therefore
  # inconclusive, not exculpatory, which is why it must never gate.
  litmus7-arm64:
    name: litmus7 (ARM64, best-effort)
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.opam
          key: opam-herdtools7-7.58-arm64
      - name: Install herdtools7
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q opam
          opam init --bare --no-setup --disable-sandboxing
          opam switch create herd ocaml-system || opam switch herd
          eval $(opam env)
          opam install -y herdtools7.7.58
      - name: Compile and run on hardware
        run: |
          eval $(opam env)
          litmus7 -o /tmp/lit tools/litmus/*.litmus
          make -C /tmp/lit -j"$(nproc)"
          cd /tmp/lit && sh run.sh | tee /tmp/lit/results.txt
      - name: Summary
        run: grep -E '^(Test|Observation|Histogram)' /tmp/lit/results.txt || true
