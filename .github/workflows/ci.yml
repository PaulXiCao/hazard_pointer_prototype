name: CI

on:
  push:
    branches: master
  pull_request:

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cache/CPM

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format 21
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash /tmp/llvm.sh 21
          sudo apt-get install -y -q clang-format-21
      - name: Check formatting
        run: |
          find . \( -name '*.hpp' -o -name '*.cpp' \) ! -path './.cache/*' ! -path './build*/*' ! -path './folly/*' \
            | xargs clang-format-21 --dry-run --Werror

  build:
    name: build (${{ matrix.compiler }}, ${{ matrix.build_type }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]
        include:
          - compiler: gcc
            cc: gcc-14
            cxx: g++-14
          - compiler: clang
            cc: clang-21
            cxx: clang++-21
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ hashFiles('CMakeLists.txt') }}
      - name: Install GCC 14
        if: matrix.compiler == 'gcc'
        run: sudo apt-get install -y -q gcc-14 g++-14
      - name: Install Clang 21
        if: matrix.compiler == 'clang'
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash /tmp/llvm.sh 21
          sudo apt-get install -y -q clang-21
      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake --preset ci -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - run: cmake --build --preset ci
      - run: ctest --preset ci

  gcc16-contracts:
    name: gcc16 (contracts, Debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ hashFiles('CMakeLists.txt') }}
      - name: Install GCC 16
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-16 g++-16
      - name: Configure
        env:
          CC: gcc-16
          CXX: g++-16
        run: cmake --preset ci -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_STANDARD=26 -DCMAKE_CXX_FLAGS=-fcontracts
      - run: cmake --build --preset ci
      - run: ctest --preset ci

  windows:
    name: windows (msvc)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - uses: actions/cache@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-windows-${{ hashFiles('CMakeLists.txt') }}
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        run: cmake --preset dev
      - run: cmake --build --preset dev
      - run: ctest --preset dev

  sanitize:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: asan+ubsan
            preset: asan
          - name: tsan
            preset: tsan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ hashFiles('CMakeLists.txt') }}
      - name: Install Clang 21
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash /tmp/llvm.sh 21
          sudo apt-get install -y -q clang-21
      - name: Configure
        env:
          CC: clang-21
          CXX: clang++-21
        run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --preset ${{ matrix.preset }}

  tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ hashFiles('CMakeLists.txt') }}
      - name: Install Clang 21
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash /tmp/llvm.sh 21
          sudo apt-get install -y -q clang-21 clang-tidy-21
      - name: Configure
        env:
          CC: clang-21
          CXX: clang++-21
        run: cmake --preset ci -DENABLE_CLANG_TIDY=ON -DCLANG_TIDY_EXE=clang-tidy-21
      - name: Build (runs clang-tidy)
        run: cmake --build --preset ci
