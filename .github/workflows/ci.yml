name: CI

on:
  push:
    branches: master
  pull_request:
  workflow_dispatch:      # litmus7-arm64 runs on this event only

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cache/CPM

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install clang-format 21
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash /tmp/llvm.sh 21
          sudo apt-get install -y -q clang-format-21
      - name: Check formatting
        run: |
          find . \( -name '*.hpp' -o -name '*.cpp' \) ! -path './.cache/*' ! -path './build*/*' ! -path './folly/*' \
            | xargs clang-format-21 --dry-run --Werror

  build:
    name: build (${{ matrix.compiler }}, ${{ matrix.build_type }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]
        include:
          - compiler: gcc
            cc: gcc-14
            cxx: g++-14
          - compiler: clang
            cc: clang-21
            cxx: clang++-21
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ hashFiles('CMakeLists.txt') }}
      - name: Install GCC 14
        if: matrix.compiler == 'gcc'
        run: sudo apt-get install -y -q gcc-14 g++-14
      - name: Install Clang 21
        if: matrix.compiler == 'clang'
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash /tmp/llvm.sh 21
          sudo apt-get install -y -q clang-21
      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake --preset ci -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - run: cmake --build --preset ci
      - run: ctest --preset ci

  # gcc-16 comes from the flake (devShells.gcc16), not ppa:ubuntu-toolchain-r.
  # The PPA route broke on 2026-08-12 -- add-apt-repository hit Launchpad and got
  # an IncompleteRead -- and a .deb cache would not fix it, since GitHub evicts
  # caches after 7 idle days and this repo's runs are weeks apart.  nixpkgs has
  # gcc 16.1.0 prebuilt, so this is a download, not a toolchain build.
  gcc16-contracts:
    name: gcc16 (contracts, Debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: actions/cache@v6
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ hashFiles('CMakeLists.txt') }}
      - name: Configure
        run: |
          nix develop .#gcc16 --command \
            cmake --preset ci -DCMAKE_BUILD_TYPE=Debug \
                  -DCMAKE_CXX_STANDARD=26 -DCMAKE_CXX_FLAGS=-fcontracts
      - run: nix develop .#gcc16 --command cmake --build --preset ci
      - run: nix develop .#gcc16 --command ctest --preset ci

  windows:
    name: windows (msvc)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned, not @latest -- on this repo `latest` is a mutable *branch*, so it
      # would pull breaking changes into CI unannounced.  No floating major tag
      # is published here (unlike actions/*), hence the exact release.
      - uses: lukka/get-cmake@v4.4.2
      - uses: actions/cache@v6
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-windows-${{ hashFiles('CMakeLists.txt') }}
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        run: cmake --preset dev
      - run: cmake --build --preset dev
      - run: ctest --preset dev

  sanitize:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: asan+ubsan
            preset: asan
          - name: tsan
            preset: tsan
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ hashFiles('CMakeLists.txt') }}
      - name: Install Clang 21
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash /tmp/llvm.sh 21
          sudo apt-get install -y -q clang-21
      - name: Configure
        env:
          CC: clang-21
          CXX: clang++-21
        run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --preset ${{ matrix.preset }}

  tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ hashFiles('CMakeLists.txt') }}
      - name: Install Clang 21
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash /tmp/llvm.sh 21
          sudo apt-get install -y -q clang-21 clang-tidy-21
      - name: Configure
        env:
          CC: clang-21
          CXX: clang++-21
        run: cmake --preset ci -DENABLE_CLANG_TIDY=ON -DCLANG_TIDY_EXE=clang-tidy-21
      - name: Build (runs clang-tidy)
        run: cmake --build --preset ci

  # GATING.  Deterministic check of the reclaim-side memory-ordering argument
  # against the C11 abstract machine.  Platform independent -- an x86 runner is
  # fine, since herd7 enumerates the model rather than executing on hardware.
  # If the seq_cst fence in synchronize() is removed or weakened,
  # hazptr-fence.litmus flips away from Never and this job fails.
  herd7:
    name: herd7 (memory model)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      # herdtools7 is not packaged in nixpkgs, so the flake builds it from
      # source (~3-6 min).  Cache /nix/store keyed on flake.lock so that only
      # happens when the pin actually changes.
      - uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'tools/litmus/herdtools7.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 2G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 604800
      - name: Litmus suite
        run: nix develop --command bash tools/litmus/run.sh

  # MANUAL DISPATCH ONLY, and non-gating even then.  Hardware stress of the same
  # litmus files.
  #
  # A clean run proves nothing -- sampling can only ever produce weak positive
  # evidence, never a green light -- so this must not gate, and is not worth a
  # toolchain build on every push.  Run it from the Actions tab when
  # investigating.
  #
  # Note x86 does NOT hide this shape: TSO permits exactly the StoreLoad
  # reordering it needs, and P1's release store + acquire load compile to plain
  # movs.  Observed on an x86_64 dev machine at 1 and 127 per 10^6.  (What
  # Rodgers meant by x86 hiding it is the *real* code, where the reclaim path's
  # mutex locked-RMWs sit between the removal store and the scan -- a different
  # program from this abstraction.)  So this job is useful on x86 too; ARM64 is
  # kept because weaker hardware should show it more readily.
  litmus7-arm64:
    name: litmus7 (ARM64, manual)
    runs-on: ubuntu-24.04-arm
    if: github.event_name == 'workflow_dispatch'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-arm64-${{ hashFiles('flake.lock', 'tools/litmus/herdtools7.nix') }}
          restore-prefixes-first-match: nix-arm64-
          gc-max-store-size-linux: 2G
      # -c11 true is required for C litmus tests, and litmus7 will not create
      # the output directory itself.
      - name: Compile and run on hardware
        run: |
          mkdir -p /tmp/lit
          nix develop --command bash -c '
            set -e
            litmus7 -c11 true -o /tmp/lit tools/litmus/*.litmus
            make -C /tmp/lit -j"$(nproc)"
            cd /tmp/lit && sh run.sh
          ' | tee /tmp/results.txt
      - name: Summary
        run: grep -E '^(Test|Observation|Histogram)' /tmp/results.txt || true
